<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HQ Radar - Avellanosa de Muñó</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }

    /* Pantalla de Bloqueo / Login */
    #authOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.97);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .auth-card {
      background: #1e293b;
      padding: 32px;
      border-radius: 16px;
      border: 1px solid #334155;
      width: 90%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .auth-card h2 { margin-top: 0; color: #38bdf8; font-size: 22px; }

    .team-status-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .status-pill {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
    }

    .status-pill b { display: block; margin-bottom: 4px; font-size: 14px; }
    .ready { color: #10b981; }
    .waiting { color: #f59e0b; }

    .auth-card select, .auth-card input {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 16px;
    }

    .auth-card button {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      background: #3b82f6;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .auth-card button:hover { background: #2563eb; }

    .error-msg {
      color: #ef4444;
      font-size: 14px;
      margin-top: 12px;
      line-height: 1.4;
      display: none;
    }

    /* Header del Radar Activo */
    #header {
      background: #1e293b;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #334155;
      z-index: 1000;
    }

    .session-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge {
      background: #0f172a;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      border: 1px solid #475569;
    }

    .logout-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    #map { flex: 1; }
    .timer { font-size: 20px; font-weight: bold; color: #ef4444; animation: blink 1s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</head>
<body>

  <!-- Modal de Selección de Equipo y PIN -->
  <div id="authOverlay">
    <div class="auth-card">
      <h2>📡 Acceso Radar - Avellanosa</h2>
      
      <div class="team-status-box">
        <div class="status-pill" id="pillTeamA">
          <b>Equipo A</b>
          <span id="statusTextA" class="ready">Listo para usar</span>
        </div>
        <div class="status-pill" id="pillTeamB">
          <b>Equipo B</b>
          <span id="statusTextB" class="ready">Listo para usar</span>
        </div>
      </div>

      <select id="userTeamSelect">
        <option value="A">Capitán Equipo A (Ver al B)</option>
        <option value="B">Capitán Equipo B (Ver al A)</option>
      </select>

      <input type="password" id="pinInput" placeholder="Introduce tu PIN" maxlength="6" inputmode="numeric">
      
      <button onclick="handleLogin()">Activar Radar (30s)</button>
      <div id="loginError" class="error-msg"></div>
    </div>
  </div>

  <!-- Vista del Mapa Activo -->
  <div id="header">
    <div class="session-info">
      <span id="activeTeamBadge" class="badge">Objetivo: --</span>
      <button class="logout-btn" onclick="handleLogout('Manual')">🔒 Salir</button>
    </div>
    <div class="timer" id="timerDisplay">RADAR ACTIVO: 30s</div>
  </div>
  <div id="map"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDHz7xkbRDQyCA6Y3bb19g0R2EzK919t7s",
      authDomain: "escondite-9f8b6.firebaseapp.com",
      databaseURL: "https://escondite-9f8b6-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "escondite-9f8b6",
      storageBucket: "escondite-9f8b6.firebasestorage.app",
      messagingSenderId: "630083248771",
      appId: "1:630083248771:web:50688687698c48947631b6"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Avellanosa de Muñó
    const VILLAGE_LAT = 41.983498;
    const VILLAGE_LNG = -3.824581;

    const map = L.map('map').setView([VILLAGE_LAT, VILLAGE_LNG], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let currentSessionTeam = null;  // 'A' o 'B'
    let currentTargetTeam = null;   // 'B' o 'A'
    let allPlayers = {};
    let activeLayers = [];
    let cooldowns = { A: 0, B: 0 };

    const COOLDOWN_MS = 10 * 60 * 1000; // 10 minutos
    const REVEAL_MS = 30 * 1000;         // 30 segundos

    // Sincronizar cooldowns independientes desde Firebase
    db.ref('cooldowns').on('value', (snapshot) => {
      cooldowns = snapshot.val() || { A: 0, B: 0 };
    });

    // Sincronizar coordenadas de los jugadores
    db.ref('players').on('value', (snapshot) => {
      allPlayers = snapshot.val() || {};
      if (currentTargetTeam) {
        drawMarkers();
      }
    });

    function handleLogin() {
      const selected = document.getElementById('userTeamSelect').value;
      const pin = document.getElementById('pinInput').value.trim();
      const errEl = document.getElementById('loginError');
      const now = Date.now();

      // Comprobar contraseña
      if (selected === 'A' && pin !== '1111') {
        errEl.innerText = '❌ PIN incorrecto para el Equipo A (1111)';
        errEl.style.display = 'block';
        return;
      }
      if (selected === 'B' && pin !== '9999') {
        errEl.innerText = '❌ PIN incorrecto para el Equipo B (9999)';
        errEl.style.display = 'block';
        return;
      }

      // Comprobar cooldown independiente del equipo
      const lastUsed = cooldowns[selected] || 0;
      const timePassed = now - lastUsed;

      if (timePassed < COOLDOWN_MS) {
        // Aún en cooldown
        const remaining = Math.ceil((COOLDOWN_MS - timePassed) / 1000);
        const mins = Math.floor(remaining / 60);
        const secs = String(remaining % 60).padStart(2, '0');
        errEl.innerText = `⏳ Tu equipo ya usó el radar. Disponible en ${mins}:${secs}`;
        errEl.style.display = 'block';
        return;
      }

      // Activar radar: guardar timestamp en Firebase para arrancar sus 10 min
      db.ref(`cooldowns/${selected}`).set(now);

      currentSessionTeam = selected;
      currentTargetTeam = selected === 'A' ? 'B' : 'A';

      document.getElementById('loginError').style.display = 'none';
      document.getElementById('pinInput').value = '';
      document.getElementById('authOverlay').style.display = 'none';
      document.getElementById('activeTeamBadge').innerText = `Equipo ${selected} (Espiando a: ${currentTargetTeam})`;
      
      map.invalidateSize();
      drawMarkers();
    }

    function handleLogout(reason) {
      currentSessionTeam = null;
      currentTargetTeam = null;
      clearMarkers();
      document.getElementById('authOverlay').style.display = 'flex';
      document.getElementById('activeTeamBadge').innerText = 'Objetivo: --';
      
      const errEl = document.getElementById('loginError');
      if (reason === 'TimeUp') {
        errEl.innerText = '⌛ Se agotaron los 30 segundos. Tu radar entra en espera de 10 minutos.';
        errEl.style.display = 'block';
      }
    }

    function clearMarkers() {
      activeLayers.forEach(layer => map.removeLayer(layer));
      activeLayers = [];
    }

    function drawMarkers() {
      clearMarkers();
      if (!currentTargetTeam) return;

      const now = Date.now();

      Object.values(allPlayers).forEach(p => {
        if (p.team === currentTargetTeam && (now - p.updatedAt) < 15 * 60 * 1000) {
          const color = currentTargetTeam === 'A' ? '#3b82f6' : '#f97316';

          const radiusCircle = L.circle([p.lat, p.lng], {
            radius: p.accuracy || 15,
            color: color,
            weight: 1,
            fillColor: color,
            fillOpacity: 0.15
          }).addTo(map);

          const marker = L.circleMarker([p.lat, p.lng], {
            radius: 8,
            fillColor: color,
            color: '#ffffff',
            weight: 2,
            fillOpacity: 0.95
          }).bindPopup(`
            <div style="color: #111;">
              <b>${p.name}</b><br>
              Precisión: ±${Math.round(p.accuracy)}m<br>
              Último ping: ${new Date(p.updatedAt).toLocaleTimeString()}
            </div>
          `).addTo(map);

          activeLayers.push(radiusCircle, marker);
        }
      });
    }

    // Actualizador de cooldowns y expulsión a los 30s
    function updateTimers() {
      const now = Date.now();

      // 1. Actualizar estado visual de los dos equipos en el menú de inicio
      ['A', 'B'].forEach(team => {
        const lastUsed = cooldowns[team] || 0;
        const timePassed = now - lastUsed;
        const textEl = document.getElementById(`statusText${team}`);

        if (timePassed < COOLDOWN_MS) {
          const remaining = Math.ceil((COOLDOWN_MS - timePassed) / 1000);
          const mins = Math.floor(remaining / 60);
          const secs = String(remaining % 60).padStart(2, '0');
          textEl.innerText = `Espera: ${mins}:${secs}`;
          textEl.className = 'waiting';
        } else {
          textEl.innerText = `🟢 Disponible`;
          textEl.className = 'ready';
        }
      });

      // 2. Si hay una sesión activa, controlar los 30 segundos
      if (currentSessionTeam) {
        const sessionStart = cooldowns[currentSessionTeam] || 0;
        const elapsed = now - sessionStart;

        if (elapsed < REVEAL_MS) {
          const remainingSecs = Math.ceil((REVEAL_MS - elapsed) / 1000);
          document.getElementById('timerDisplay').innerText = `🚨 RADAR ACTIVO: ${remainingSecs}s`;
        } else {
          handleLogout('TimeUp');
        }
      }
    }

    setInterval(updateTimers, 1000);
  </script>
</body>
</html>
