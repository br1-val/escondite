<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HQ Radar - Avellanosa de Muñó</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }

    /* Pantalla de Bloqueo / Login */
    #authOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.97);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .auth-card {
      background: #1e293b;
      padding: 32px;
      border-radius: 16px;
      border: 1px solid #334155;
      width: 90%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .auth-card h2 { margin-top: 0; color: #38bdf8; font-size: 24px; margin-bottom: 20px; }

    .team-status-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .status-pill {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
    }

    .status-pill b { display: block; margin-bottom: 6px; font-size: 15px; }
    .ready { color: #10b981; font-weight: bold; }
    .waiting { color: #f59e0b; font-weight: bold; }

    .auth-card input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 20px;
      text-align: center;
      letter-spacing: 4px;
    }

    .auth-card button {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      background: #3b82f6;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .auth-card button:hover { background: #2563eb; }

    .error-msg {
      color: #ef4444;
      font-size: 14px;
      margin-top: 14px;
      line-height: 1.4;
      display: none;
    }

    /* Header del Radar Activo */
    #header {
      background: #1e293b;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #334155;
      z-index: 1000;
    }

    .session-info {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      background: #0f172a;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: bold;
      border: 1px solid #475569;
    }

    .logout-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .admin-controls {
      display: none;
      gap: 8px;
      align-items: center;
    }

    .btn-action {
      border: none;
      padding: 7px 11px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .reset-btn { background: #f59e0b; color: #111; }
    .endgame-btn { background: #dc2626; color: white; }
    .resume-btn { background: #10b981; color: white; display: none; }
    .clear-players-btn { background: #64748b; color: white; }

    #map { flex: 1; }
    .timer { font-size: 20px; font-weight: bold; color: #ef4444; animation: blink 1s infinite; }
    .admin-timer { color: #10b981 !important; animation: none !important; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .leaflet-control-layers {
      background: #1e293b !important;
      color: #f8fafc !important;
      border: 1px solid #475569 !important;
      border-radius: 8px !important;
    }
  </style>
</head>
<body>

  <!-- Modal de PIN -->
  <div id="authOverlay">
    <div class="auth-card">
      <h2>📡 HQ Radar Central</h2>
      
      <div class="team-status-box">
        <div class="status-pill" id="pillTeamA">
          <b>Equipo A</b>
          <span id="statusTextA" class="ready">Listo para usar</span>
        </div>
        <div class="status-pill" id="pillTeamB">
          <b>Equipo B</b>
          <span id="statusTextB" class="ready">Listo para usar</span>
        </div>
      </div>

      <input type="password" id="pinInput" placeholder="PIN" maxlength="4" inputmode="numeric" autofocus>
      
      <button onclick="handleLogin()">Acceder al Radar</button>
      <div id="loginError" class="error-msg"></div>
    </div>
  </div>

  <!-- Dashboard Principal -->
  <div id="header">
    <div class="session-info">
      <span id="activeTeamBadge" class="badge">Objetivo: --</span>
      <button class="logout-btn" onclick="handleLogout('Manual')">🔒 Salir</button>
      
      <div id="adminActions" class="admin-controls">
        <button class="btn-action reset-btn" onclick="resetAllCooldowns()">🔄 Reset Tiempos</button>
        <button id="endGameBtn" class="btn-action endgame-btn" onclick="promptEndGame()">🏁 Terminar Partida</button>
        <button id="resumeGameBtn" class="btn-action resume-btn" onclick="resumeGame()">▶️ Nueva Ronda</button>
        <button class="btn-action clear-players-btn" onclick="clearAllPlayers()">🗑️ Borrar Jugadores</button>
      </div>
    </div>
    <div class="timer" id="timerDisplay">RADAR ACTIVO: 30s</div>
  </div>
  <div id="map"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDHz7xkbRDQyCA6Y3bb19g0R2EzK919t7s",
      authDomain: "escondite-9f8b6.firebaseapp.com",
      databaseURL: "https://escondite-9f8b6-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "escondite-9f8b6",
      storageBucket: "escondite-9f8b6.firebasestorage.app",
      messagingSenderId: "630083248771",
      appId: "1:630083248771:web:50688687698c48947631b6"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Avellanosa de Muñó
    const VILLAGE_LAT = 41.983498;
    const VILLAGE_LNG = -3.824581;

    // Capas Satélite Híbrido + Callejero
    const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Esri World Imagery'
    });

    const labelsLayer = L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19
    });

    const hybridGroup = L.layerGroup([satLayer, labelsLayer]);

    const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: 'OpenStreetMap'
    });

    const map = L.map('map', {
      center: [VILLAGE_LAT, VILLAGE_LNG],
      zoom: 16,
      layers: [hybridGroup]
    });

    L.control.layers({
      "🛰️ Satélite Híbrido": hybridGroup,
      "🗺️ Callejero": streetLayer
    }, null, { position: 'topright' }).addTo(map);

    let currentSessionRole = null; // 'A', 'B', o 'ADMIN'
    let currentTargetTeam = null;  // 'A', 'B', o 'ALL'
    let allPlayers = {};
    let activeLayers = [];
    let cooldowns = { A: 0, B: 0 };

    const COOLDOWN_MS = 10 * 60 * 1000; // 10 minutos
    const REVEAL_MS = 30 * 1000;         // 30 segundos

    // Sincronización de Cooldowns
    db.ref('cooldowns').on('value', (snapshot) => {
      cooldowns = snapshot.val() || { A: 0, B: 0 };
    });

    // Sincronización de Jugadores
    db.ref('players').on('value', (snapshot) => {
      allPlayers = snapshot.val() || {};
      if (currentTargetTeam) {
        drawMarkers();
      }
    });

    // Sincronización de Estado de Partida
    db.ref('gameState').on('value', (snapshot) => {
      const state = snapshot.val();
      const endBtn = document.getElementById('endGameBtn');
      const resumeBtn = document.getElementById('resumeGameBtn');
      if (state && state.status === 'ENDED') {
        if (endBtn) endBtn.style.display = 'none';
        if (resumeBtn) resumeBtn.style.display = 'inline-block';
      } else {
        if (endBtn) endBtn.style.display = 'inline-block';
        if (resumeBtn) resumeBtn.style.display = 'none';
      }
    });

    // Enter en input PIN
    document.getElementById('pinInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') handleLogin();
    });

    function handleLogin() {
      const pin = document.getElementById('pinInput').value.trim();
      const now = Date.now();

      // ADMIN PIN: 0007
      if (pin === '0007') {
        currentSessionRole = 'ADMIN';
        currentTargetTeam = 'ALL';
        loginSuccess('MODO ADMIN (Viendo todos)');
        document.getElementById('adminActions').style.display = 'flex';
        return;
      }

      // EQUIPO A: 1111
      if (pin === '1111') {
        const timePassed = now - (cooldowns.A || 0);
        if (timePassed < COOLDOWN_MS) {
          const remaining = Math.ceil((COOLDOWN_MS - timePassed) / 1000);
          const mins = Math.floor(remaining / 60);
          const secs = String(remaining % 60).padStart(2, '0');
          showError(`⏳ Equipo A en espera. Disponible en ${mins}:${secs}`);
          return;
        }

        db.ref('cooldowns/A').set(now);
        currentSessionRole = 'A';
        currentTargetTeam = 'B';
        loginSuccess('Equipo A (Espiando a: Equipo B)');
        return;
      }

      // EQUIPO B: 9999
      if (pin === '9999') {
        const timePassed = now - (cooldowns.B || 0);
        if (timePassed < COOLDOWN_MS) {
          const remaining = Math.ceil((COOLDOWN_MS - timePassed) / 1000);
          const mins = Math.floor(remaining / 60);
          const secs = String(remaining % 60).padStart(2, '0');
          showError(`⏳ Equipo B en espera. Disponible en ${mins}:${secs}`);
          return;
        }

        db.ref('cooldowns/B').set(now);
        currentSessionRole = 'B';
        currentTargetTeam = 'A';
        loginSuccess('Equipo B (Espiando a: Equipo A)');
        return;
      }

      showError('❌ PIN incorrecto');
    }

    function showError(msg) {
      const errEl = document.getElementById('loginError');
      errEl.innerText = msg;
      errEl.style.display = 'block';
    }

    function loginSuccess(badgeText) {
      document.getElementById('loginError').style.display = 'none';
      document.getElementById('pinInput').value = '';
      document.getElementById('authOverlay').style.display = 'none';
      document.getElementById('activeTeamBadge').innerText = badgeText;
      
      map.invalidateSize();
      drawMarkers();
    }

    function handleLogout(reason) {
      currentSessionRole = null;
      currentTargetTeam = null;
      clearMarkers();
      document.getElementById('adminActions').style.display = 'none';
      document.getElementById('authOverlay').style.display = 'flex';
      document.getElementById('activeTeamBadge').innerText = 'Objetivo: --';
      document.getElementById('pinInput').focus();
      
      if (reason === 'TimeUp') {
        showError('⌛ Se agotaron los 30 segundos. Radar bloqueado por 10 minutos.');
      }
    }

    // Funciones de Administrador
    function promptEndGame() {
      const choice = prompt('🏁 ¿Quién ha ganado la partida?\nEscribe:\nA = Equipo A\nB = Equipo B\nE = Empate');
      if (!choice) return;

      let winnerText = '';
      if (choice.trim().toUpperCase() === 'A') winnerText = 'Equipo A';
      else if (choice.trim().toUpperCase() === 'B') winnerText = 'Equipo B';
      else if (choice.trim().toUpperCase() === 'E') winnerText = '¡Empate!';
      else {
        alert('Opción no válida');
        return;
      }

      db.ref('gameState').set({
        status: 'ENDED',
        winner: winnerText,
        endedAt: Date.now()
      });
    }

    function resumeGame() {
      if (confirm('¿Reanudar y empezar una nueva ronda? Silenciará las alarmas de los móviles.')) {
        db.ref('gameState').set({
          status: 'ACTIVE',
          resumedAt: Date.now()
        });
      }
    }

    function resetAllCooldowns() {
      if (confirm('¿Resetear los temporizadores de ambos equipos a 0?')) {
        db.ref('cooldowns').set({ A: 0, B: 0 });
      }
    }

    function clearAllPlayers() {
      if (confirm('⚠️ ¿Seguro que quieres borrar a TODOS los jugadores de la partida?')) {
        db.ref('players').remove();
        clearMarkers();
      }
    }

    function clearMarkers() {
      activeLayers.forEach(layer => map.removeLayer(layer));
      activeLayers = [];
    }

    function drawMarkers() {
      clearMarkers();
      if (!currentTargetTeam) return;

      const now = Date.now();

      Object.values(allPlayers).forEach(p => {
        const isTarget = currentTargetTeam === 'ALL' || p.team === currentTargetTeam;
        if (isTarget && (now - p.updatedAt) < 15 * 60 * 1000) {
          const color = p.team === 'A' ? '#38bdf8' : '#fb923c';

          const radiusCircle = L.circle([p.lat, p.lng], {
            radius: p.accuracy || 15,
            color: color,
            weight: 2,
            fillColor: color,
            fillOpacity: 0.25
          }).addTo(map);

          const marker = L.circleMarker([p.lat, p.lng], {
            radius: 9,
            fillColor: color,
            color: '#ffffff',
            weight: 3,
            fillOpacity: 1
          }).bindPopup(`
            <div style="color: #111;">
              <b>${p.name}</b> (${p.team === 'A' ? 'Eq. A' : 'Eq. B'})<br>
              Precisión: ±${Math.round(p.accuracy)}m<br>
              Último ping: ${new Date(p.updatedAt).toLocaleTimeString()}
            </div>
          `).addTo(map);

          activeLayers.push(radiusCircle, marker);
        }
      });
    }

    // Actualizador de temporizadores
    function updateTimers() {
      const now = Date.now();

      ['A', 'B'].forEach(team => {
        const lastUsed = cooldowns[team] || 0;
        const timePassed = now - lastUsed;
        const textEl = document.getElementById(`statusText${team}`);

        if (timePassed < COOLDOWN_MS) {
          const remaining = Math.ceil((COOLDOWN_MS - timePassed) / 1000);
          const mins = Math.floor(remaining / 60);
          const secs = String(remaining % 60).padStart(2, '0');
          textEl.innerText = `Espera: ${mins}:${secs}`;
          textEl.className = 'waiting';
        } else {
          textEl.innerText = `🟢 Disponible`;
          textEl.className = 'ready';
        }
      });

      const timerEl = document.getElementById('timerDisplay');
      if (currentSessionRole === 'ADMIN') {
        timerEl.innerText = '🛡️ MODO ADMIN (SIN LÍMITE)';
        timerEl.className = 'timer admin-timer';
      } else if (currentSessionRole === 'A' || currentSessionRole === 'B') {
        const sessionStart = cooldowns[currentSessionRole] || 0;
        const elapsed = now - sessionStart;

        if (elapsed < REVEAL_MS) {
          const remainingSecs = Math.ceil((REVEAL_MS - elapsed) / 1000);
          timerEl.innerText = `🚨 RADAR ACTIVO: ${remainingSecs}s`;
          timerEl.className = 'timer';
        } else {
          handleLogout('TimeUp');
        }
      }
    }

    setInterval(updateTimers, 1000);
  </script>
</body>
</html>
