<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escondite Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 24px;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
    }
    h2 { margin-top: 0; color: #38bdf8; font-size: 24px; }
    input, select, button {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
    }
    button {
      background: #10b981;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.2s;
    }
    button:disabled { background: #475569; cursor: not-allowed; }
    .status {
      margin-top: 16px;
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      white-space: pre-line;
    }

    .accuracy-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      margin-top: 8px;
    }
    .acc-great { background: #065f46; color: #34d399; }
    .acc-medium { background: #854d0e; color: #fde047; }
    .acc-bad { background: #991b1b; color: #fca5a5; }

    /* Overlay de Fin de Partida */
    #gameOverOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #7f1d1d;
      color: white;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
      z-index: 99999;
      animation: alertPulse 1.2s infinite alternate;
    }

    @keyframes alertPulse {
      from { background: #7f1d1d; }
      to { background: #991b1b; }
    }

    .alert-icon { font-size: 64px; margin-bottom: 10px; animation: bounce 0.6s infinite alternate; }
    @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.15); } }

    .winner-banner {
      font-size: 26px;
      font-weight: 900;
      color: #fef08a;
      margin-bottom: 12px;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .base-order {
      font-size: 32px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 24px;
      letter-spacing: 1px;
    }

    .silence-btn {
      background: #ffffff;
      color: #991b1b;
      font-weight: bold;
      font-size: 18px;
      padding: 16px 32px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- Overlay de Fin de Partida -->
  <div id="gameOverOverlay">
    <div class="alert-icon">🚨</div>
    <div style="font-size: 20px; font-weight: bold; margin-bottom: 8px;">PARTIDA TERMINADA</div>
    <div class="winner-banner" id="winnerAnnouncement">¡GANADOR: EQUIPO A!</div>
    <div class="base-order">📍 ¡VOLVED A LA BASE!</div>
    <button class="silence-btn" onclick="silenceAlarm()">🔕 Silenciar Alarma</button>
  </div>

  <div class="card">
    <h2>📡 Escondite Tracker</h2>
    <input id="playerName" placeholder="Tu Nombre">
    <select id="team">
      <option value="A">Equipo A (Se esconden)</option>
      <option value="B">Equipo B (Buscan)</option>
    </select>
    <button id="startBtn" onclick="startTracking()">Comenzar Transmisión</button>
    <div class="status" id="status">Introduce tu nombre y pulsa Comenzar.</div>
    <div id="accuracyBadge" class="accuracy-badge" style="display:none;"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDHz7xkbRDQyCA6Y3bb19g0R2EzK919t7s",
      authDomain: "escondite-9f8b6.firebaseapp.com",
      databaseURL: "https://escondite-9f8b6-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "escondite-9f8b6",
      storageBucket: "escondite-9f8b6.firebasestorage.app",
      messagingSenderId: "630083248771",
      appId: "1:630083248771:web:50688687698c48947631b6"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let watchId = null;
    let pingInterval = null;
    let bestCoordsInWindow = null;
    let lastSentCoords = null;
    let myPlayerRef = null;
    let audioCtx = null;
    let sirenInterval = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSirenBeep() {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.35);

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);

        if ('vibrate' in navigator) {
          navigator.vibrate([200, 100, 200]);
        }
      } catch (e) {}
    }

    function triggerAlarm(winner) {
      document.getElementById('winnerAnnouncement').innerText = `🏆 ¡GANADOR: ${winner.toUpperCase()}!`;
      document.getElementById('gameOverOverlay').style.display = 'flex';

      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      if (pingInterval !== null) clearInterval(pingInterval);

      playSirenBeep();
      if (!sirenInterval) {
        sirenInterval = setInterval(playSirenBeep, 500);
      }
    }

    function silenceAlarm() {
      if (sirenInterval) {
        clearInterval(sirenInterval);
        sirenInterval = null;
      }
      document.getElementById('gameOverOverlay').style.display = 'none';
      stopTracking('Partida finalizada por el Administrador.');
    }

    // Escuchar estado global
    db.ref('gameState').on('value', (snapshot) => {
      const state = snapshot.val();
      if (state && state.status === 'ENDED') {
        triggerAlarm(state.winner || 'PARTIDA CONCLUIDA');
      } else if (state && state.status === 'ACTIVE') {
        if (sirenInterval) clearInterval(sirenInterval);
        document.getElementById('gameOverOverlay').style.display = 'none';
      }
    });

    async function startTracking() {
      initAudio();
      const name = document.getElementById('playerName').value.trim();
      const team = document.getElementById('team').value;
      if (!name) return alert('Por favor, introduce tu nombre');

      if ('wakeLock' in navigator) {
        try { await navigator.wakeLock.request('screen'); } catch(e) {}
      }

      document.getElementById('startBtn').disabled = true;
      document.getElementById('playerName').disabled = true;
      document.getElementById('team').disabled = true;
      document.getElementById('status').innerText = '🛰️ Enganchando satélites GPS de alta precisión...';

      const safeKey = name.replace(/[.#$[\]]/g, "_");
      myPlayerRef = db.ref(`players/${safeKey}`);

      myPlayerRef.on('value', (snapshot) => {
        if (lastSentCoords && !snapshot.exists()) {
          stopTracking('Partida reiniciada por el Administrador.');
        }
      });

      // 1. Escucha continua en hardware con máxima resolución (sin caché)
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const acc = pos.coords.accuracy;
          
          // Actualizar semáforo de precisión en pantalla
          const badge = document.getElementById('accuracyBadge');
          badge.style.display = 'inline-block';
          if (acc <= 10) {
            badge.className = 'accuracy-badge acc-great';
            badge.innerText = `🛰️ Precisión Excelente (±${Math.round(acc)}m)`;
          } else if (acc <= 25) {
            badge.className = 'accuracy-badge acc-medium';
            badge.innerText = `📡 Precisión Normal (±${Math.round(acc)}m)`;
          } else {
            badge.className = 'accuracy-badge acc-bad';
            badge.innerText = `⚠️ Buscando mejor señal (±${Math.round(acc)}m)`;
          }

          // Guardamos siempre la muestra con MENOR margen de error durante esta ventana
          if (!bestCoordsInWindow || acc < bestCoordsInWindow.accuracy) {
            bestCoordsInWindow = {
              lat: pos.coords.latitude,
              lng: pos.coords.longitude,
              accuracy: acc
            };
          }
        },
        (err) => {
          document.getElementById('status').innerText = `⚠️ Error GPS: ${err.message}\nActiva la Ubicación Precisa en ajustes del navegador.`;
        },
        { 
          enableHighAccuracy: true, // Fuerza uso de antena GPS
          maximumAge: 0,            // Cero caché, posición instantánea
          timeout: 8000 
        }
      );

      // 2. Transmisión a Firebase cada 10 segundos eligiendo la mejor muestra capturada
      pingInterval = setInterval(() => {
        const coordsToSend = bestCoordsInWindow || lastSentCoords;

        if (coordsToSend && myPlayerRef) {
          const payload = {
            name,
            team,
            lat: coordsToSend.lat,
            lng: coordsToSend.lng,
            accuracy: coordsToSend.accuracy,
            updatedAt: Date.now()
          };

          myPlayerRef.set(payload);
          lastSentCoords = coordsToSend;
          // Reiniciar para encontrar la mejor muestra en los siguientes 10 segundos
          bestCoordsInWindow = null; 

          document.getElementById('status').innerText = 
            `🟢 Transmitiendo (ping cada 10s)\nMargen de error enviado: ±${Math.round(coordsToSend.accuracy)}m\nÚltimo envío: ${new Date().toLocaleTimeString()}`;
        }
      }, 10000);
    }

    function stopTracking(msg) {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      if (pingInterval !== null) clearInterval(pingInterval);
      if (myPlayerRef) myPlayerRef.off();

      watchId = null;
      pingInterval = null;
      bestCoordsInWindow = null;
      lastSentCoords = null;
      myPlayerRef = null;

      document.getElementById('startBtn').disabled = false;
      document.getElementById('playerName').disabled = false;
      document.getElementById('team').disabled = false;
      document.getElementById('status').innerText = `ℹ️ ${msg}\nPuedes volver a iniciar cuando quieras.`;
      document.getElementById('accuracyBadge').style.display = 'none';
    }
  </script>
</body>
</html>
